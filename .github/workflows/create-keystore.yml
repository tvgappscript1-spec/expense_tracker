name: 1. Tao keystore (chay 1 lan duy nhat)

# Chi chay thu cong. KHONG bao gio chay tu dong.
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Ten alias cua key (giu mac dinh neu khong ro)'
        required: true
        default: 'expense-upload'
      validity_years:
        description: 'So nam hieu luc'
        required: true
        default: '30'

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sinh mat khau ngau nhien va tao keystore
        id: gen
        run: |
          set -e
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          ALIAS="${{ github.event.inputs.key_alias }}"
          DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))

          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 \
            -validity "$DAYS" \
            -alias "$ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Expense Tracker, OU=Personal, O=Personal, L=Ho Chi Minh, S=Ho Chi Minh, C=VN"

          base64 -w 0 upload-keystore.jks > keystore_base64.txt

          {
            echo "=========================================================="
            echo " CHEP 4 GIA TRI DUOI DAY VAO GITHUB SECRETS"
            echo " Settings -> Secrets and variables -> Actions -> New secret"
            echo "=========================================================="
            echo ""
            echo "Ten secret: KEY_ALIAS"
            echo "Gia tri   : $ALIAS"
            echo ""
            echo "Ten secret: KEY_PASSWORD"
            echo "Gia tri   : $STORE_PASS"
            echo ""
            echo "Ten secret: STORE_PASSWORD"
            echo "Gia tri   : $STORE_PASS"
            echo ""
            echo "Ten secret: KEYSTORE_BASE64"
            echo "Gia tri   : (noi dung file keystore_base64.txt trong Artifacts)"
            echo ""
            echo "=========================================================="
            echo " CANH BAO: mat file .jks nay = VINH VIEN khong cap nhat"
            echo " duoc app cu nua. Tai ve va cat giu o noi an toan."
            echo "=========================================================="
          } > HUONG_DAN.txt

          cat HUONG_DAN.txt

      - name: Dong goi keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-CHU-Y-BI-MAT
          path: |
            upload-keystore.jks
            keystore_base64.txt
            HUONG_DAN.txt
          retention-days: 7
          if-no-files-found: error

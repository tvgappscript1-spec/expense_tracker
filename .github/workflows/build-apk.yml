name: Build APK

# Chay khi: push len nhanh main, HOAC bam nut thu cong trong tab Actions
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cho phep workflow tao Release va dinh kem file APK
permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------
      - name: Lay ma nguon
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      - name: Cai Java 17 (Gradle yeu cau)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------------------------------
      - name: Cai Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Kiem tra phien ban
        run: |
          flutter --version
          java -version

      # ----------------------------------------------------------------
      # Repo chi chua lib/ + pubspec.yaml + AndroidManifest.xml.
      # Thu muc android/ do Flutter tu sinh theo dung phien ban SDK.
      # Backup file rieng -> flutter create -> restore lai.
      # ----------------------------------------------------------------
      - name: Sinh lop nen Android
        run: |
          set -e
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          fi

          flutter create \
            --platforms=android \
            --org com.vuong.expense \
            --project-name expense_tracker \
            .

          rm -rf lib
          cp -r /tmp/backup/lib lib
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          if [ -f /tmp/backup/AndroidManifest.xml ]; then
            cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      # ----------------------------------------------------------------
      - name: Nang minSdk len 24 (ML Kit OCR bat buoc >= 21)
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^([[:space:]]*)minSdk[[:space:]]*=.*/\1minSdk = 24/' android/app/build.gradle.kts
            grep -n "minSdk" android/app/build.gradle.kts
          else
            sed -i -E 's/^([[:space:]]*)minSdkVersion.*/\1minSdkVersion 24/' android/app/build.gradle
            grep -n "minSdk" android/app/build.gradle
          fi

      # ----------------------------------------------------------------
      # R8 (bo nen code khi build release) bao loi "Missing class" vi plugin
      # ML Kit tham chieu ca 5 bo nhan dang (Latin/Trung/Nhat/Han/Devanagari)
      # trong khi APK chi nhung thu vien Latin. Khai bao -dontwarn de R8 bo qua.
      # ----------------------------------------------------------------
      - name: Tao proguard-rules.pro
        run: |
          cat > android/app/proguard-rules.pro << 'EOF'
          # ===== ML Kit Text Recognition =====
          # Chi dung bo chu Latin, 4 bo con lai khong nhung vao APK.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**

          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }
          -keep class com.google.android.odml.** { *; }
          -dontwarn com.google.mlkit.**

          # ===== Flutter =====
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.embedding.** { *; }
          -dontwarn io.flutter.embedding.**

          # ===== sqflite / image_picker =====
          -keep class com.tekartik.sqflite.** { *; }
          -keep class io.flutter.plugins.imagepicker.** { *; }

          # Giu ten dong/lop dung cho reflection cua Play Services
          -keepattributes *Annotation*, InnerClasses, Signature, Exceptions
          EOF
          echo "--- Noi dung proguard-rules.pro ---"
          cat android/app/proguard-rules.pro

      - name: Noi proguard vao cau hinh build release
        run: |
          set -e
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/release {/s//release {\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
            GRADLE_FILE=android/app/build.gradle.kts
          else
            sed -i '0,/release {/s//release {\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
            GRADLE_FILE=android/app/build.gradle
          fi

          echo "--- Khoi buildTypes sau khi va ---"
          grep -n -A 8 "buildTypes" "$GRADLE_FILE"

          # Dung ngay neu va that bai, thay vi de build chay 6 phut roi moi loi
          if ! grep -q "proguard-rules.pro" "$GRADLE_FILE"; then
            echo "::error::Khong chen duoc proguardFiles vao $GRADLE_FILE"
            exit 1
          fi

      # ----------------------------------------------------------------
      # KY APK BANG KEYSTORE CO DINH
      #
      # Mac dinh Flutter ky release bang DEBUG key. Moi lan CI chay lai la mot
      # may ao moi -> debug key khac nhau -> Android tu choi cai de ("App not
      # installed"), buoc phai go app = MAT SACH du lieu SQLite.
      #
      # Buoc nay khoi phuc keystore tu Secrets de moi ban build deu cung chu
      # ky, nho do cai de duoc va du lieu duoc giu nguyen.
      #
      # Neu chua khai bao Secrets, buoc nay tu bo qua va van ky bang debug key
      # (chi hop de cai thu lan dau).
      # ----------------------------------------------------------------
      - name: Khoi phuc keystore tu Secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Chua co secret KEYSTORE_BASE64 - se ky bang debug key. APK nay KHONG cai de len ban truoc duoc."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

          cat > android/key.properties << 'EOF'
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

          echo "Keystore da khoi phuc ($(stat -c%s android/app/upload-keystore.jks) bytes)"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Cau hinh Gradle ky release
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -e
          GRADLE_FILE=android/app/build.gradle.kts
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE=android/app/build.gradle
          fi

          if [ "${GRADLE_FILE##*.}" = "kts" ]; then
            # Nap key.properties o dau file
            cat > /tmp/header.kts << 'EOF'
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          EOF
            cat /tmp/header.kts "$GRADLE_FILE" > /tmp/merged.kts
            mv /tmp/merged.kts "$GRADLE_FILE"

            # Khai bao signingConfigs va tro release sang no
            sed -i '0,/buildTypes {/s//signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {/' "$GRADLE_FILE"

            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$GRADLE_FILE"
          else
            sed -i '0,/buildTypes {/s//signingConfigs {\n        release {\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n        }\n    }\n\n    buildTypes {/' "$GRADLE_FILE"
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' "$GRADLE_FILE"
          fi

          echo "--- Cau hinh sau khi va ---"
          grep -n -A 6 "signingConfigs" "$GRADLE_FILE"

          if ! grep -q 'getByName("release")\|signingConfigs.release' "$GRADLE_FILE"; then
            echo "::error::Khong tro duoc release sang keystore that"
            exit 1
          fi

      - name: Tang RAM cho Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      # ----------------------------------------------------------------
      - name: Tai package
        run: |
          flutter pub get || flutter pub upgrade --major-versions

      - name: Phan tich ma nguon (khong chan build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ----------------------------------------------------------------
      - name: Build APK release
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build them ban universal (chay moi may)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Liet ke file da build
        run: ls -lh build/app/outputs/flutter-apk/

      # ----------------------------------------------------------------
      - name: Tai APK len Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # ----------------------------------------------------------------
      # Xuat ban ra muc Releases: tai duoc bang link truc tiep tren dien
      # thoai, khong can dang nhap, khong phai giai nen zip nhu Artifacts.
      # ----------------------------------------------------------------
      - name: Xuat ban ra Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Quan ly chi tieu - ban ${{ github.run_number }}"
          body: |
            Ban dung tu dong ngay ${{ github.event.repository.updated_at }}.

            **Chon file nao?**
            - `app-arm64-v8a-release.apk` — dien thoai Android tu 2019 tro len (khuyen dung)
            - `app-armeabi-v7a-release.apk` — may cu, RAM thap
            - `app-release.apk` — ban dung chung, chay moi may (nang hon)

            Yeu cau: Android 7.0 (API 24) tro len.
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false

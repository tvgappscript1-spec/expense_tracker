name: expense_tracker
description: "Ung dung quan ly thu chi ca nhan - offline first, co OCR quet hoa don."
publish_to: 'none'
# QUY TAC: moi lan phat hanh ban cap nhat PHAI tang so sau dau '+'
# (buildNumber -> versionCode cua Android). Neu khong tang, Android coi la
# cung mot ban va tu choi cai de.
version: 1.3.2+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Cho DatePicker / MaterialLocalizations tieng Viet
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.69.0

  # Lich thang
  table_calendar: ^3.1.2

  # Format tien te / ngay thang.
  # Dung `any` co chu dich: flutter_localizations GHIM cung 1 phien ban intl
  # tuy theo ban Flutter SDK. De `^0.19.0` se bao "version solving failed"
  # tren Flutter moi. `any` cho pub tu chon dung phien ban khop SDK.
  intl: any

  # OCR + chon anh
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # Sao luu / khoi phuc: chon file de nhap, chia se file de xuat.
  # Ghim khoang ban on dinh: file_picker 8.3.x va share_plus 10.x da chay
  # tot voi compileSdk 36. Tranh de mo (`^`) keo len ban rat moi doi cau
  # hinh Gradle khac.
  file_picker: ">=8.1.2 <9.0.0"
  share_plus: ">=10.1.1 <11.0.0"

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: expense_tracker
description: "Ung dung quan ly thu chi ca nhan - offline first, co OCR quet hoa don."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Cho DatePicker / MaterialLocalizations tieng Viet
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.69.0

  # Format tien te / ngay thang.
  # Dung `any` co chu dich: flutter_localizations GHIM cung 1 phien ban intl
  # tuy theo ban Flutter SDK. De `^0.19.0` se bao "version solving failed"
  # tren Flutter moi. `any` cho pub tu chon dung phien ban khop SDK.
  intl: any

  # OCR + chon anh
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
